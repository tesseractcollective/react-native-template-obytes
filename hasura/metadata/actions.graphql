    args: AuthEmailInput!
  ): AuthOutput
}

type Mutation {
  authMagicLinkSignIn(
    args: AuthEmailTicketInput!
  ): AuthOutput
}

type Mutation {
  authMagicLinkSignUpAndSend(
    args: AuthEmailSignupInput!
  ): AuthOutput
