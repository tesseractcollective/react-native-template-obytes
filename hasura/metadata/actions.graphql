  ): AuthOutput
}

type Mutation {
  authEmailUpdate(
    args: AuthEmailInput!
  ): AuthOutput
}

type Mutation {
  authEmailVerify(
    args: AuthEmailTicketInput!
  ): AuthOutput
}

type Mutation {
