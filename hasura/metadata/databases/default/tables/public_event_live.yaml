table:
  name: event_live
  schema: public
object_relationships:
  - name: event
    using:
      foreign_key_constraint_on: event_id
  - name: profile
    using:
      foreign_key_constraint_on: profile_id
  - name: question
    using:
      foreign_key_constraint_on: question_id
  - name: questionSet
    using:
      foreign_key_constraint_on: question_set_id
  - name: raffle
    using:
      foreign_key_constraint_on: raffle_id
  - name: tenant
    using:
      foreign_key_constraint_on: tenant_id
array_relationships:
  - name: raffleTickets
    using:
      foreign_key_constraint_on:
        column: event_live_id
        table:
          name: game_raffle_ticket
          schema: public
computed_fields:
  - name: liveResponseCounts
    definition:
      function:
        name: aggregate_response_counts_for_event_live
        schema: public
    comment: Gets the response counts for the currently active question_set
  - name: serverTime
    definition:
      function:
        name: current_time
        schema: public
insert_permissions:
  - role: tenant_admin
    permission:
      check:
        tenant_id:
          _eq: X-Hasura-Tenant-Id
      set:
        tenant_id: X-Hasura-Tenant-Id
      columns: '*'
  - role: user_base
    permission:
      check:
        profile_id:
          _eq: X-Hasura-User-Id
      set:
        tenant_id: x-hasura-tenant-id
      columns:
        - event_id
        - is_live
        - is_paused
        - profile_id
        - question_set_id
        - raffle_id
        - start_timestamp
    comment: ""
select_permissions:
  - role: public
    permission:
      columns:
        - cleanup_ready
        - created_at
        - event_id
        - id
        - is_live
        - is_paused
        - profile_id
        - next_timer
        - question_id
        - question_set_id
        - raffle_id
        - show_after_question_details
        - start_timestamp
        - tenant_id
        - updated_at
      computed_fields:
        - liveResponseCounts
        - serverTime
      filter: {}
      limit: 1
    comment: ""
  - role: tenant_admin
    permission:
      columns: '*'
      filter:
        tenant_id:
          _eq: X-Hasura-Tenant-Id
      allow_aggregations: true
  - role: user_base
    permission:
      columns:
        - cleanup_ready
        - created_at
        - event_id
        - id
        - is_live
        - is_paused
        - profile_id
        - next_timer
        - question_id
        - question_set_id
        - raffle_id
        - show_after_question_details
        - start_timestamp
        - tenant_id
        - updated_at
      computed_fields:
        - liveResponseCounts
        - serverTime
      filter: {}
      limit: 1
    comment: ""
update_permissions:
  - role: tenant_admin
    permission:
      columns: '*'
      filter:
        tenant_id:
          _eq: X-Hasura-Tenant-Id
      check:
        tenant_id:
          _eq: X-Hasura-Tenant-Id
      set:
        tenant_id: X-Hasura-Tenant-Id
  - role: user_base
    permission:
      columns:
        - is_live
        - is_paused
        - profile_id
        - question_id
        - question_set_id
        - raffle_id
        - start_timestamp
      filter:
        profile_id:
          _eq: X-Hasura-User-Id
      check:
        profile_id:
          _eq: X-Hasura-User-Id
      set:
        tenant_id: x-hasura-tenant-id
    comment: ""
delete_permissions:
  - role: tenant_admin
    permission:
      filter:
        tenant_id:
          _eq: X-Hasura-Tenant-Id
event_triggers:
  - name: all_event_live
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: '{{WORKER_URL}}/event'
    headers:
      - name: x-api-key
        value_from_env: WORKER_API_KEY
