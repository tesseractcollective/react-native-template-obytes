table:
  name: post_media_kind
  schema: public
event_triggers:
  - name: all_post_media_kind
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: '{{WORKER_URL}}/event'
    headers:
      - name: x-api-key
        value_from_env: WORKER_API_KEY
