table:
  name: user_session
  schema: public
object_relationships:
  - name: profile
    using:
      foreign_key_constraint_on: profile_id
insert_permissions:
  - role: tenant_admin
    permission:
      check:
        tenant_id:
          _eq: X-Hasura-Tenant-Id
      set:
        tenant_id: X-Hasura-Tenant-Id
      columns: '*'
select_permissions:
  - role: tenant_admin
    permission:
      columns: '*'
      filter:
        tenant_id:
          _eq: X-Hasura-Tenant-Id
      allow_aggregations: true
update_permissions:
  - role: tenant_admin
    permission:
      columns: '*'
      filter:
        tenant_id:
          _eq: X-Hasura-Tenant-Id
      check:
        tenant_id:
          _eq: X-Hasura-Tenant-Id
      set:
        tenant_id: X-Hasura-Tenant-Id
delete_permissions:
  - role: tenant_admin
    permission:
      filter:
        tenant_id:
          _eq: X-Hasura-Tenant-Id
event_triggers:
  - name: user_session_all
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: '{{WORKER_URL}}'
    headers:
      - name: x-api-key
        value_from_env: WORKER_API_KEY
